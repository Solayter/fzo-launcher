name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check publication boundary
        shell: pwsh
        run: python tools/audit_source.py
      - name: Test updater and trust checks
        shell: pwsh
        run: ./test.ps1
      - name: Build launcher
        shell: pwsh
        run: ./build.ps1
      - name: Preserve unsigned build for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FZO-Launcher-unsigned
          path: |
            dist/FZO-Launcher.exe
            dist/FZO-Launcher.exe.config
          if-no-files-found: error
          retention-days: 14
